[project]
name = "code-intel"
version = "0.1.0"
description = "Local-first Code Intelligence Platform: deterministic static analysis + optional AI enrichment as a context-retrieval backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pathspec>=0.12",
    "typer>=0.12",
    "rich>=13.7",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "networkx>=3.3",
    "httpx>=0.27",
    "qdrant-client>=1.11",
    "fastapi>=0.110",
]

[project.optional-dependencies]
# Needed only to serve the HTTP API / browser UI: `code-intel serve`.
serve = ["uvicorn>=0.30"]

[project.scripts]
code-intel = "code_intel.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_intel"]

# Ship the built browser UI (static assets) inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"src/code_intel/webui" = "code_intel/webui"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src"]

# Third-party packages that ship no type stubs. We isolate the untyped surface
# behind our own typed wrappers, so ignoring missing imports here is safe.
[[tool.mypy.overrides]]
module = ["networkx", "networkx.*", "qdrant_client", "qdrant_client.*", "uvicorn"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
